name: BLOCKVERSE Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "cmdline-tools;latest" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Godot 4.7.2
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          mv "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"
          "$HOME/godot/godot" --headless --version
      - name: Install matching Godot 4.7.2 Android export templates
        run: |
          set -euxo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O "$HOME/godot/templates.tpz"
          mkdir -p "$HOME/godot/templates"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp "$HOME/godot/templates/templates/android_debug.apk" "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          cp "$HOME/godot/templates/templates/android_release.apk" "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"
          printf '4.7.2.stable' > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"
      - name: Configure Android paths
        run: |
          mkdir -p .godot
          cat > .godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/sdk_path = "$ANDROID_HOME"
          EOF
      - name: Create CI release keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/blockverse-release.keystore" -storepass blockverse -keypass blockverse -alias blockverse -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BLOCKVERSE"
      - name: Validate Android build environment
        run: |
          set -euxo pipefail
          java -version
          test -x "$ANDROID_HOME/build-tools/36.1.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.1.0/aapt2"
          "$HOME/godot/godot" --headless --path . --editor --quit
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/blockverse-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: blockverse
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: blockverse
        run: |
          set -euxo pipefail
          rm -rf build
          mkdir -p build
          "$HOME/godot/godot" --headless --path . --export-release Android build/BLOCKVERSE.apk
      - name: Verify APK
        run: |
          set -euxo pipefail
          test -s build/BLOCKVERSE.apk
          file build/BLOCKVERSE.apk
          ls -lh build/BLOCKVERSE.apk
          unzip -t build/BLOCKVERSE.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose build/BLOCKVERSE.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump badging build/BLOCKVERSE.apk | tee /tmp/badging.txt
          grep -q "package: name='com.kazembarani.blockverse'" /tmp/badging.txt
      - name: Upload APK artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: BLOCKVERSE-APK
          path: build/BLOCKVERSE.apk
          if-no-files-found: error
