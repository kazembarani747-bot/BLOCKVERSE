name: BLOCKVERSE Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Export APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.7.2/Godot_v4.7.2-stable_linux_headless.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.7.2/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          relative_export_path: build
          cache: true

      - name: Verify APK exists
        run: |
          test -s build/BLOCKVERSE.apk
          file build/BLOCKVERSE.apk
          ls -lh build/BLOCKVERSE.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLOCKVERSE-APK
          path: build/BLOCKVERSE.apk
          if-no-files-found: error
